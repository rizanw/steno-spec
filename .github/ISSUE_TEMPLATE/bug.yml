name: Bug report
description: Something in steno does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, use the Security tab instead of a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Where is the problem
      options:
        - The steno command
        - VS Code extension
        - Paseo plugin
        - Orca plugin
        - Language server (steno lsp) in another editor
        - A steno skill
        - Docs
        - Not sure
    validations:
      required: true
  - type: input
    id: steno-version
    attributes:
      label: steno version
      description: Output of `steno --version`. For the extension, its version from the Extensions view; for a plugin, its version in the app's plugin list.
      placeholder: 0.1.2 (protocol 1)
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`. Leave empty if you only use the VS Code extension.
      placeholder: v22.11.0
  - type: input
    id: editor-version
    attributes:
      label: Editor version
      description: For the extension, a plugin or the language server, the editor or app and its version, such as from Help > About.
      placeholder: VS Code 1.125.0
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      description: Which agent ran the steno skills, if any.
      options:
        - Claude Code
        - OpenAI Codex CLI
        - OpenCode
        - Google Antigravity
        - Cursor
        - GitHub Copilot
        - Gemini CLI
        - Kiro
        - None (CLI, extension or plugin only)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran, in order. A link to a small repo helps a lot.
      placeholder: |
        1. steno init --agent claude
        2. steno new my-feature
        3. steno lint requirements my-feature
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the full output or error. Add `--json` output if relevant.
      render: shell
    validations:
      required: true

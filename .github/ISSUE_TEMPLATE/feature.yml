name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like steno to do. Example commands or files are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other approaches you considered.
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      options:
        - label: I read the design principles in CONTRIBUTING.md, and this proposal keeps to them (or I explain why it should not).

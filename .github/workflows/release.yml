name: Release

# Push a tag matching both package versions (e.g. v0.2.0) to publish steno-spec to npm with provenance and the
# VS Code extension to the VS Code Marketplace and Open VSX, all from the one tag.
# Auth is trusted publishing (OIDC) for all three with no stored token.
#
# An odd minor is a pre-release, an even one a release (VS Code's convention: both extension registries take
# only major.minor.patch). A pre-release goes to npm under `next` and to both registries with --pre-release.
#
# Do not re-run after a partial publish: npm refuses a version it already has. Finish a failed registry step by
# hand: download this run's `vsix` artifact and run `vsce publish --packagePath <file>` or `ovsx publish <file>`
# with a token of your own (add --pre-release for an odd minor).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing to npm and both extension registries, and npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # before anything is built or published: a wrong tag stops the release here
      - name: Check the tag and both versions
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          cli=$(node -p "require('./packages/cli/package.json').version")
          ext=$(node -p "require('./packages/vscode/package.json').version")
          fail() { echo "::error::$1"; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
          [ "$version" = "$cli" ] || fail "tag $GITHUB_REF_NAME != packages/cli version $cli"
          [ "$version" = "$ext" ] || fail "tag $GITHUB_REF_NAME != packages/vscode version $ext"
          minor=$(echo "$version" | cut -d. -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if (( minor % 2 == 1 )); then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
            echo "pre-release=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "pre-release=" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint:skills
      # pnpm publish rewrites workspace:* ranges; npm publish would ship them as-is.
      - run: pnpm publish --provenance --access public --no-git-checks --tag ${{ steps.release.outputs.npm-tag }}
        working-directory: packages/cli
      # one .vsix, packaged once: both registries get this exact file. vsce only publishes a file as a
      # pre-release if it was packaged as one, so the flag goes on the package step too.
      - name: Package the extension
        working-directory: packages/vscode
        run: pnpm exec vsce package --no-dependencies ${{ steps.release.outputs.pre-release }} --out steno-vscode-${{ steps.release.outputs.version }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: packages/vscode/steno-vscode-${{ steps.release.outputs.version }}.vsix
          if-no-files-found: error
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        run: pnpm exec vsce publish --oidc --packagePath steno-vscode-${{ steps.release.outputs.version }}.vsix ${{ steps.release.outputs.pre-release }}
      - name: Publish to Open VSX
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            pnpm exec ovsx publish steno-vscode-${{ steps.release.outputs.version }}.vsix ${{ steps.release.outputs.pre-release }}
          else
            # an empty OVSX_PAT must not reach ovsx: a token takes priority over trusted publishing
            unset OVSX_PAT
            pnpm exec ovsx publish steno-vscode-${{ steps.release.outputs.version }}.vsix ${{ steps.release.outputs.pre-release }} --trusted-publishing
          fi

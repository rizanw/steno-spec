name: Release

# Start a release from the Actions tab (Run workflow, version: 0.2.0) once main carries that version in every
# package. The `tag` job tests main's commit, commits the built Orca plugin (packages/orca/dist/) on top of it and
# tags that commit v<version>; every later job works from the tag. steno-spec and the Paseo plugin (steno-paseo) go
# to npm with provenance, the VS Code extension to the VS Code Marketplace and Open VSX, and the Orca plugin to
# orca-catalog.json. Auth is trusted publishing (OIDC) everywhere with no stored token.
#
# The tag holds dist/ because Orca runs no build: it installs the plugin folder from the exact commit a release
# names. Orca's community directory (orca.dev/plugins) also lists the newest v<major>.<minor>.<patch> tag, finding
# the plugin through orca-catalog.json's source.path, and refuses a tag whose plugin folder lacks the files its
# manifest names. main itself never holds built files: the release commit is reachable only from its tag.
#
# An odd minor is a pre-release, an even one a release (VS Code's convention: both extension registries take
# only major.minor.patch). A pre-release goes to npm under `next` and to both registries with --pre-release.
#
# A release can be resumed: run the workflow again with the same version. An existing tag is reused, not rebuilt (a
# second build would differ by its commit date, and a registry or catalog may already point at the first), and every
# publish step first asks its registry whether the version is already there and skips it if so. A run uses this file
# from the branch it is started on.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, such as 0.2.0; every package on main must already carry it'
        required: true

permissions:
  contents: read
  id-token: write # trusted publishing to npm and both extension registries, and npm provenance

jobs:
  # Tests run before the tag exists: once pushed, a tag can be listed by Orca's directory within the hour.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
      pre-release: ${{ steps.release.outputs.pre-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # before anything is built or published: a wrong version stops the release here
      - name: Check the version and every package
        id: release
        env:
          INPUT: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          version="${INPUT#v}"
          tag="v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "$INPUT is not <major>.<minor>.<patch>"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
            git checkout --quiet "$tag"
            echo "$tag already exists, resuming the release from its commit"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            [ "$GITHUB_REF" = refs/heads/main ] || fail "start a new release from main, not $GITHUB_REF_NAME"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          for package in cli vscode paseo orca; do
            found=$(node -p "require('./packages/$package/package.json').version")
            [ "$version" = "$found" ] || fail "$tag != packages/$package version $found"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          minor=$(echo "$version" | cut -d. -f2)
          if (( minor % 2 == 1 )); then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
            echo "pre-release=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "pre-release=" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.release.outputs.exists == 'false'
      - uses: actions/setup-node@v7
        if: steps.release.outputs.exists == 'false'
        with:
          node-version: 24
          cache: pnpm
      - name: Build and test
        if: steps.release.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm lint:skills
      - name: Commit the built plugin and tag it
        if: steps.release.outputs.exists == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f packages/orca/dist
          git commit --quiet -m "release ${TAG#v}"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  publish:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm publish rewrites workspace:* ranges; npm publish would ship them as-is. Each publish step skips a
      # version its registry already has, so a re-run publishes only what is missing.
      - name: Publish steno-spec to npm
        working-directory: packages/cli
        run: |
          if npm view "steno-spec@${{ needs.tag.outputs.version }}" version >/dev/null 2>&1; then
            echo "steno-spec ${{ needs.tag.outputs.version }} is already on npm, skipping"
          else
            pnpm publish --provenance --access public --no-git-checks --tag ${{ needs.tag.outputs.npm-tag }}
          fi
      # The plugin bundles everything it runs and declares no dependencies; Paseo provides its host modules.
      - name: Publish steno-paseo to npm
        working-directory: packages/paseo
        run: |
          if npm view "steno-paseo@${{ needs.tag.outputs.version }}" version >/dev/null 2>&1; then
            echo "steno-paseo ${{ needs.tag.outputs.version }} is already on npm, skipping"
          else
            pnpm publish --provenance --access public --no-git-checks --tag ${{ needs.tag.outputs.npm-tag }}
          fi
      # one .vsix, packaged once: both registries get this exact file. vsce only publishes a file as a
      # pre-release if it was packaged as one, so the flag goes on the package step too.
      - name: Package the extension
        working-directory: packages/vscode
        run: pnpm exec vsce package --no-dependencies ${{ needs.tag.outputs.pre-release }} --out steno-vscode-${{ needs.tag.outputs.version }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: packages/vscode/steno-vscode-${{ needs.tag.outputs.version }}.vsix
          if-no-files-found: error
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        run: |
          version=${{ needs.tag.outputs.version }}
          if pnpm exec vsce show rzndwb.steno-vscode --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s).versions.some(v=>v.version===process.argv[1])?0:1))' "$version"; then
            echo "steno-vscode $version is already on the Marketplace, skipping"
          else
            pnpm exec vsce publish --oidc --packagePath steno-vscode-$version.vsix ${{ needs.tag.outputs.pre-release }}
          fi
      - name: Publish to Open VSX
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if curl -sf -o /dev/null "https://open-vsx.org/api/rzndwb/steno-vscode/${{ needs.tag.outputs.version }}"; then
            echo "steno-vscode ${{ needs.tag.outputs.version }} is already on Open VSX, skipping"
          elif [ -n "$OVSX_PAT" ]; then
            pnpm exec ovsx publish steno-vscode-${{ needs.tag.outputs.version }}.vsix ${{ needs.tag.outputs.pre-release }}
          else
            # an empty OVSX_PAT must not reach ovsx: a token takes priority over trusted publishing
            unset OVSX_PAT
            pnpm exec ovsx publish steno-vscode-${{ needs.tag.outputs.version }}.vsix ${{ needs.tag.outputs.pre-release }} --trusted-publishing
          fi

  # main's orca-catalog.json lists the tag's commit, which is the one file this job pushes to main. A protected main
  # needs a bypass for the workflow's token; without one the push fails here, and `scripts/catalog.mjs` lists the
  # release by hand (see packages/orca/README.md). Every release is listed, pre-releases too: Orca's community
  # directory lists every tag anyway, so leaving one out here would only make the two catalogs disagree.
  catalog:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      - name: List the release in orca-catalog.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git rev-parse "$TAG^{commit}")
          # the plugin exactly as the release commit holds it, and the tag's scripts, before main replaces the tree
          plugin="$RUNNER_TEMP/plugin"
          mkdir -p "$plugin" "$RUNNER_TEMP/scripts"
          git archive "$commit:packages/orca" | tar -x -C "$plugin"
          [ -f "$plugin/dist/worker.mjs" ] || { echo "::error::$TAG holds no built plugin in packages/orca/dist"; exit 1; }
          cp packages/orca/scripts/catalog.mjs packages/orca/scripts/content-hash.mjs "$RUNNER_TEMP/scripts/"
          git fetch --no-tags origin main
          git checkout --quiet -B main origin/main
          node "$RUNNER_TEMP/scripts/catalog.mjs" orca-catalog.json "$plugin" "$commit" "$GITHUB_REPOSITORY"
          if git diff --quiet -- orca-catalog.json; then
            echo "orca-catalog.json already lists $VERSION, nothing to push"
          else
            git add orca-catalog.json
            git commit --quiet -m "chore(orca): list steno-orca $VERSION in the catalog"
            git push origin main
          fi

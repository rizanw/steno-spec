version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Stay on TypeScript 5.x until 7 matures; 5.x minor/patch bumps still come through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to engines.vscode so the extension cannot use an API its oldest supported VS Code lacks; vsce and
      # the manifest test refuse a mismatch. Raise both together when the minimum VS Code moves.
      - dependency-name: "@types/vscode"
      # Paseo supplies these to the plugin at run time, so the plugin typechecks against the oldest versions its
      # minimum Paseo ships. Raise them with requirements.paseo in packages/paseo/paseo-plugin.json.
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']


name: Release

# Push a tag matching the CLI version (e.g. v0.1.0) to publish steno-spec to npm with provenance.
# Auth is npm trusted publishing (OIDC): no token; npm trusts this repo + release.yml directly.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint:skills
      - name: Check tag matches package version
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version v$v"; exit 1; }
      # pnpm pack runs prepack and rewrites workspace:* ranges; npm publish then uploads the
      # tarball, since npm's trusted publishing (OIDC) is the reference implementation.
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/cli
      - name: Publish
        run: |
          npm --version
          npm publish "$RUNNER_TEMP"/steno-spec-*.tgz --provenance --access public
